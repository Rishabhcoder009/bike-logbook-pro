<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BikeCare</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BikeCare">

<style>

*{box-sizing:border-box;}

html,body{
margin:0;
padding:0;
overflow-x:hidden;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#000;
color:#f5f5f5;
}

/* SPLASH */

#splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
transition:opacity .6s ease;
}

#splash img{
width:130px;
margin-bottom:20px;
}

#splash h1{
font-size:36px;
color:#2d6cdf;
text-shadow:
0 0 10px #2d6cdf,
0 0 20px #2d6cdf,
0 0 40px rgba(45,108,223,.9);
}

/* CONTAINER */

.container{
max-width:600px;
width:100%;
margin:auto;
padding:24px;
padding-top:calc(24px + env(safe-area-inset-top));
padding-bottom:calc(24px + env(safe-area-inset-bottom));
display:none;
}

/* TITLE */

h1{
font-size:26px;
margin-bottom:20px;
}

/* CARDS */

.card{
background:#0b0f14;
padding:22px;
border-radius:24px;
margin-bottom:22px;
border:1px solid #111;
width:100%;
}

/* TABS */

.tabs{
display:flex;
gap:10px;
margin-bottom:22px;
}

.tabs button{
flex:1;
padding:16px;
border-radius:18px;
border:none;
background:#111;
color:#666;
font-weight:600;
font-size:16px;
}

.tabs button.active{
background:#2d6cdf;
color:white;
box-shadow:0 0 20px rgba(45,108,223,.7);
}

/* INPUT */

input{
width:100%;
max-width:100%;
padding:14px;
border-radius:14px;
border:1px solid #1a1f27;
background:#121821;
color:white;
margin-bottom:14px;
font-size:16px;
}

/* iPhone date fix */

input[type="date"]{
width:100%;
max-width:100%;
appearance:none;
-webkit-appearance:none;
}

/* BUTTON */

button.primary{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:#2d6cdf;
color:white;
font-weight:600;
font-size:16px;
margin-bottom:12px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
font-size:14px;
table-layout:fixed;
}

th,td{
padding:10px 6px;
border-bottom:1px solid #111;
word-break:break-word;
}

th:nth-child(1),td:nth-child(1){width:28%}
th:nth-child(2),td:nth-child(2){width:52%}
th:nth-child(3),td:nth-child(3){width:20%}

/* STATS */

.stat{
background:#0a0f14;
border-radius:20px;
padding:18px;
margin-bottom:14px;
text-align:center;
border:1px solid #111;
}

.stat-row{
display:flex;
gap:10px;
}

.stat.small{
flex:1;
}

.label{
font-size:12px;
color:#666;
}

.value{
font-size:20px;
font-weight:600;
}

.main-stat .value{
font-size:40px;
}

.neon{
color:#2d6cdf;
text-shadow:
0 0 6px #2d6cdf,
0 0 14px #2d6cdf,
0 0 30px rgba(45,108,223,.8);
}

/* PB */

.pb-highlight{
background:linear-gradient(90deg,#1a1400,#000);
}

.pb-badge{
color:gold;
font-weight:bold;
margin-left:5px;
}

/* ROUTE */

.route-cell{
cursor:pointer;
}

.collapsed{
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.expanded{
white-space:normal;
}

</style>
</head>

<body>

<!-- SPLASH -->

<div id="splash">
<img src="logo.png">
<h1>BikeCare</h1>
</div>

<div class="container" id="app">

<h1>🚲 BikeCare</h1>

<div class="tabs">
<button id="tab1" class="active" onclick="showTab('maintenance')">Maintenance</button>
<button id="tab2" onclick="showTab('distance')">Ride Log</button>
</div>

<!-- MAINTENANCE -->

<div id="maintenanceTab" class="card">

<input type="date" id="date">
<input type="text" id="task" placeholder="Task">

<button class="primary" onclick="addLog()">Add Entry</button>

<table>
<thead>
<tr>
<th>Date</th>
<th>Task</th>
</tr>
</thead>

<tbody id="logTable"></tbody>
</table>

</div>

<!-- DISTANCE -->

<div id="distanceTab" class="card" style="display:none">

<div class="stat main-stat">
<div class="label">TOTAL KM</div>
<div id="totalKm" class="value neon">0</div>
</div>

<div class="stat-row">
<div class="stat small">
<div class="label">THIS MONTH</div>
<div id="monthlyKm" class="value">0 km</div>
</div>
</div>

<input type="date" id="distDate">
<input type="text" id="route" placeholder="Route">
<input type="number" id="distance" placeholder="Distance (km)">

<button class="primary" onclick="addDistance()">Add Entry</button>

<table>
<thead>
<tr>
<th>Date</th>
<th>Route</th>
<th>KM</th>
</tr>
</thead>

<tbody id="distanceTable"></tbody>
</table>

</div>

</div>

<script>

setTimeout(()=>{
splash.style.opacity="0";
setTimeout(()=>{
splash.style.display="none";
app.style.display="block";
},600);
},1300);

document.getElementById("date").valueAsDate=new Date();
document.getElementById("distDate").valueAsDate=new Date();

function showTab(tab){

maintenanceTab.style.display=tab==="maintenance"?"block":"none";
distanceTab.style.display=tab==="distance"?"block":"none";

tab1.classList.toggle("active",tab==="maintenance");
tab2.classList.toggle("active",tab==="distance");

}

/* maintenance */

let logs=JSON.parse(localStorage.getItem("logs"))||[];

function saveLogs(){
localStorage.setItem("logs",JSON.stringify(logs));
}

function addLog(){

if(!date.value||!task.value)return;

logs.push({date:date.value,task:task.value});

saveLogs();

task.value="";

renderLogs();

}

function renderLogs(){

logTable.innerHTML="";

logs.forEach(log=>{

logTable.innerHTML+=`
<tr>
<td>${log.date}</td>
<td>${log.task}</td>
</tr>`;

});

}

/* distance */

let distanceLogs=JSON.parse(localStorage.getItem("distanceLogs"))||[];

function saveDistance(){
localStorage.setItem("distanceLogs",JSON.stringify(distanceLogs));
}

function addDistance(){

if(!distDate.value||!route.value||!distance.value)return;

distanceLogs.push({
date:distDate.value,
route:route.value,
distance:parseFloat(distance.value)
});

saveDistance();

route.value="";
distance.value="";

renderDistance();

}

function renderDistance(){

distanceTable.innerHTML="";

let total=0;
let monthly=0;
let pb=0;

const now=new Date();

distanceLogs.forEach(log=>{

total+=log.distance;

if(log.distance>pb)pb=log.distance;

const d=new Date(log.date);

if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()){
monthly+=log.distance;
}

});

distanceLogs.forEach(log=>{

const isPB=log.distance===pb;

distanceTable.innerHTML+=`
<tr class="${isPB?'pb-highlight':''}">
<td>${log.date}</td>
<td class="route-cell collapsed">${log.route}</td>
<td>${log.distance}${isPB?'<span class="pb-badge"> PB</span>':''}</td>
</tr>`;

});

totalKm.innerText=total.toFixed(1);
monthlyKm.innerText=monthly.toFixed(1)+" km";

initExpand();

}

function initExpand(){

document.querySelectorAll(".route-cell").forEach(cell=>{

cell.onclick=()=>{
cell.classList.toggle("collapsed");
cell.classList.toggle("expanded");
};

});

}

renderLogs();
renderDistance();

</script>

</body>
</html>
