<head>
<meta charset="UTF-8">
<title>BikeCare</title>

<!-- Viewport -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA Support -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BikeCare">

<style>
/* Your full CSS starts below this line */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #000;
  color: #f5f5f5;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top));
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}

h1 {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

/* CARD */
.card {
  background: #0b0f14;
  padding: 18px;
  border-radius: 20px;
  margin-bottom: 20px;
  border: 1px solid #111;
  overflow: hidden;
  box-shadow:
    0 0 25px rgba(45,108,223,0.08),
    inset 0 0 15px rgba(45,108,223,0.03);
  backdrop-filter: blur(10px);
  transition: 0.3s ease;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tabs button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  background: #111;
  color: #666;
  font-weight: 600;
  transition: 0.2s;
}

.tabs button.active {
  background: #2d6cdf;
  color: white;
  box-shadow: 0 0 20px rgba(45,108,223,0.7);
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #1a1f27;
  background: #121821;
  color: white;
  margin-bottom: 12px;
  font-size: 14px;
}

input:focus {
  outline: none;
  border-color: #2d6cdf;
  box-shadow: 0 0 12px rgba(45,108,223,0.6);
}

button.primary {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #2d6cdf;
  color: white;
  font-weight: 600;
}

button.primary:hover {
  box-shadow: 0 0 25px rgba(45,108,223,0.9);
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 13px;
}

th, td {
  padding: 10px 6px;
  border-bottom: 1px solid #111;
  text-align: left;
}

/* DASHBOARD */

.dashboard { margin-bottom: 15px; }

.stat {
  background: #0a0f14;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  text-align: center;
  border: 1px solid #111;
}

.stat-row {
  display: flex;
  gap: 10px;
}

.stat.small { flex: 1; }

.label {
  font-size: 11px;
  color: #666;
  letter-spacing: 1px;
  margin-bottom: 5px;
}

.value {
  font-size: 18px;
  font-weight: 600;
}

.main-stat .value {
  font-size: 42px;
}

/* Neon TOTAL KM */
.neon {
  color: #2d6cdf;
  text-shadow:
    0 0 6px #2d6cdf,
    0 0 14px #2d6cdf,
    0 0 35px rgba(45,108,223,0.8);
  animation: pulseGlow 2.5s infinite alternate;
}

@keyframes pulseGlow {
  from {
    text-shadow:
      0 0 6px #2d6cdf,
      0 0 14px #2d6cdf,
      0 0 25px rgba(45,108,223,0.5);
  }
  to {
    text-shadow:
      0 0 10px #2d6cdf,
      0 0 25px #2d6cdf,
      0 0 45px rgba(45,108,223,1);
  }
}

/* Divider */
.divider {
  height: 1px;
  margin: 25px 0;
  background: linear-gradient(
    90deg,
    transparent,
    #2d6cdf,
    transparent
  );
}

/* Personal Best */
.pb-highlight {
  background: linear-gradient(90deg, #1a1400, #000);
  box-shadow:
    0 0 15px rgba(255,215,0,0.4),
    inset 0 0 10px rgba(255,215,0,0.2);
}

.pb-badge {
  color: gold;
  font-weight: 700;
  text-shadow:
    0 0 6px gold,
    0 0 18px rgba(255,215,0,0.8),
    0 0 30px rgba(255,215,0,0.6);
}
</style>
</head>

<body>

<div class="container">

<h1>🚲 BikeCare</h1>

<div class="tabs">
  <button id="tab1" class="active" onclick="showTab('maintenance')">Maintenance</button>
  <button id="tab2" onclick="showTab('distance')">Ride Log</button>
</div>

<!-- Maintenance -->
<div id="maintenanceTab" class="card">

<input type="date" id="date">
<input type="text" id="task" placeholder="Task">
<button class="primary" onclick="addLog()">Add Entry</button>

<table>
<thead>
<tr>
<th>Date</th>
<th>Task</th>
<th></th>
</tr>
</thead>
<tbody id="logTable"></tbody>
</table>

</div>

<!-- Ride Log -->
<div id="distanceTab" class="card" style="display:none;">

<div class="dashboard">

<div class="stat main-stat">
<div class="label">TOTAL KM</div>
<div id="totalKm" class="value neon">0</div>
</div>

<div class="stat-row">
<div class="stat small">
<div class="label">THIS WEEK</div>
<div id="weeklyKm" class="value">0 km</div>
</div>

<div class="stat small">
<div class="label">THIS MONTH</div>
<div id="monthlyKm" class="value">0 km</div>
</div>
</div>

</div>

<div class="divider"></div>

<input type="date" id="distDate">
<input type="text" id="route" placeholder="Route (HOM - GGC - HOM)">
<input type="number" id="distance" placeholder="Distance (km)">
<input type="text" id="distNotes" placeholder="Notes (optional)">
<button class="primary" onclick="addDistance()">Add Entry</button>

<table>
<thead>
<tr>
<th>Date</th>
<th>Route</th>
<th>KM</th>
<th></th>
</tr>
</thead>
<tbody id="distanceTable"></tbody>
</table>

</div>

</div>

<script>

/* AUTO DATE */
document.getElementById("date").valueAsDate = new Date();
document.getElementById("distDate").valueAsDate = new Date();

function showTab(tab) {
  document.getElementById("maintenanceTab").style.display =
    tab === "maintenance" ? "block" : "none";

  document.getElementById("distanceTab").style.display =
    tab === "distance" ? "block" : "none";

  document.getElementById("tab1").classList.toggle("active", tab === "maintenance");
  document.getElementById("tab2").classList.toggle("active", tab === "distance");
}

/* Maintenance */

let logs = JSON.parse(localStorage.getItem("logs")) || [];

function saveLogs() {
  localStorage.setItem("logs", JSON.stringify(logs));
}

function addLog() {
  const dateVal = document.getElementById("date").value;
  const taskVal = document.getElementById("task").value;
  if (!dateVal || !taskVal) return;

  logs.push({ date: dateVal, task: taskVal });
  saveLogs();
  renderLogs();
  document.getElementById("task").value = "";
}

function deleteLog(i) {
  logs.splice(i, 1);
  saveLogs();
  renderLogs();
}

function renderLogs() {
  const table = document.getElementById("logTable");
  table.innerHTML = "";

  logs.sort((a,b)=> new Date(b.date) - new Date(a.date));

  logs.forEach((log,i)=>{
    table.innerHTML += `
      <tr>
        <td>${log.date}</td>
        <td>${log.task}</td>
        <td><button onclick="deleteLog(${i})">✕</button></td>
      </tr>`;
  });
}

renderLogs();

/* Distance */

let distanceLogs = JSON.parse(localStorage.getItem("distanceLogs")) || [];

function saveDistance() {
  localStorage.setItem("distanceLogs", JSON.stringify(distanceLogs));
}

function addDistance() {
  const dateVal = document.getElementById("distDate").value;
  const routeVal = document.getElementById("route").value;
  const distVal = parseFloat(document.getElementById("distance").value);
  const notesVal = document.getElementById("distNotes").value;

  if (!dateVal || !routeVal || !distVal) return;

  distanceLogs.push({ date: dateVal, route: routeVal, distance: distVal, notes: notesVal });
  saveDistance();
  renderDistance();

  document.getElementById("route").value = "";
  document.getElementById("distance").value = "";
  document.getElementById("distNotes").value = "";
}

function deleteDistance(i) {
  distanceLogs.splice(i, 1);
  saveDistance();
  renderDistance();
}

function renderDistance() {
  const table = document.getElementById("distanceTable");
  table.innerHTML = "";

  let total = 0, weekly = 0, monthly = 0, personalBest = 0;

  const now = new Date();
  const currentWeek = getWeekNumber(now);
  const currentMonth = now.getMonth();
  const currentYear = now.getFullYear();

  distanceLogs.sort((a,b)=> new Date(b.date) - new Date(a.date));

  distanceLogs.forEach(log=>{
    total += log.distance;
    if (log.distance > personalBest) personalBest = log.distance;

    const logDate = new Date(log.date);

    if (getWeekNumber(logDate) === currentWeek &&
        logDate.getFullYear() === currentYear)
      weekly += log.distance;

    if (logDate.getMonth() === currentMonth &&
        logDate.getFullYear() === currentYear)
      monthly += log.distance;
  });

  distanceLogs.forEach((log,i)=>{
    const isPB = log.distance === personalBest;

    table.innerHTML += `
      <tr class="${isPB ? 'pb-highlight' : ''}">
        <td>${log.date}</td>
        <td>${log.route}</td>
        <td>
          ${log.distance}
          ${isPB ? '<span class="pb-badge"> PB</span>' : ''}
        </td>
        <td><button onclick="deleteDistance(${i})">✕</button></td>
      </tr>`;
  });

  document.getElementById("totalKm").innerText = total.toFixed(1);
  document.getElementById("weeklyKm").innerText = weekly.toFixed(1) + " km";
  document.getElementById("monthlyKm").innerText = monthly.toFixed(1) + " km";
}

function getWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
}

renderDistance();

</script>

</body>
</html>
