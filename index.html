<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BikeCare</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BikeCare">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #000;
  color: #f5f5f5;
}

.container {
  max-width: 520px;
  width: 100%;
  margin: auto;
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top));
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}

h1 { font-size: 22px; margin-bottom: 20px; }

.card {
  background: #0b0f14;
  padding: 16px;
  border-radius: 20px;
  margin-bottom: 20px;
  border: 1px solid #111;
  overflow: hidden;
  width: 100%;
}

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 20px; }

.tabs button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  background: #111;
  color: #666;
  font-weight: 600;
}

.tabs button.active {
  background: #2d6cdf;
  color: white;
  box-shadow: 0 0 20px rgba(45,108,223,0.7);
}

/* Inputs */
input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #1a1f27;
  background: #121821;
  color: white;
  margin-bottom: 12px;
  font-size: 16px;
}

input[type="date"] {
  max-width: 100%;
  appearance: none;
  -webkit-appearance: none;
}

button.primary {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #2d6cdf;
  color: white;
  font-weight: 600;
  margin-bottom: 10px;
}

/* Table */
.table-wrapper { width: 100%; overflow-x: hidden; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  table-layout: fixed;
}

th, td {
  padding: 8px 6px;
  border-bottom: 1px solid #111;
  text-align: left;
  word-break: break-word;
}

th:nth-child(1), td:nth-child(1) { width: 28%; }
th:nth-child(2), td:nth-child(2) { width: 52%; }
th:nth-child(3), td:nth-child(3) { width: 20%; }

/* Dashboard */
.stat {
  background: #0a0f14;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  text-align: center;
  border: 1px solid #111;
}

.stat-row { display: flex; gap: 8px; }
.stat.small { flex: 1; }

.label { font-size: 11px; color: #666; margin-bottom: 5px; }
.value { font-size: 18px; font-weight: 600; }
.main-stat .value { font-size: 36px; }

.neon {
  color: #2d6cdf;
  text-shadow:
    0 0 6px #2d6cdf,
    0 0 14px #2d6cdf,
    0 0 30px rgba(45,108,223,0.8);
}

/* PB Highlight */
.pb-highlight {
  background: linear-gradient(90deg, #1a1400, #000);
}

.pb-badge {
  color: gold;
  font-weight: bold;
  margin-left: 5px;
}

/* Swipe */
.swipe-row {
  position: relative;
  transition: transform 0.25s ease;
}

.swipe-row::after {
  content: "Delete";
  position: absolute;
  right: -80px;
  top: 0;
  height: 100%;
  width: 80px;
  background: #ff3b30;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

/* Route expand */
.route-cell { cursor: pointer; }

.collapsed {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.expanded {
  white-space: normal;
}
</style>
</head>

<body>

<div class="container">
<h1>🚲 BikeCare</h1>

<div class="tabs">
  <button id="tab1" class="active" onclick="showTab('maintenance')">Maintenance</button>
  <button id="tab2" onclick="showTab('distance')">Ride Log</button>
</div>

<!-- Maintenance -->
<div id="maintenanceTab" class="card">
<input type="date" id="date">
<input type="text" id="task" placeholder="Task">
<button class="primary" onclick="addLog()">Add Entry</button>

<div class="table-wrapper">
<table>
<thead>
<tr><th>Date</th><th>Task</th></tr>
</thead>
<tbody id="logTable"></tbody>
</table>
</div>
</div>

<!-- Distance -->
<div id="distanceTab" class="card" style="display:none;">

<div class="stat main-stat">
<div class="label">TOTAL KM</div>
<div id="totalKm" class="value neon">0</div>
</div>

<div class="stat-row">
<div class="stat small">
<div class="label">THIS MONTH</div>
<div id="monthlyKm" class="value">0 km</div>
</div>
</div>

<input type="date" id="distDate">
<input type="text" id="route" placeholder="ROUTE">
<input type="number" id="distance" placeholder="Distance (km)">
<button class="primary" onclick="addDistance()">Add Entry</button>

<div class="table-wrapper">
<table>
<thead>
<tr><th>Date</th><th>Route</th><th>KM</th></tr>
</thead>
<tbody id="distanceTable"></tbody>
</table>
</div>

</div>
</div>

<script>
document.getElementById("date").valueAsDate = new Date();
document.getElementById("distDate").valueAsDate = new Date();

function showTab(tab){
  maintenanceTab.style.display = tab==="maintenance"?"block":"none";
  distanceTab.style.display = tab==="distance"?"block":"none";
  tab1.classList.toggle("active",tab==="maintenance");
  tab2.classList.toggle("active",tab==="distance");
}

/* =========================
   MAINTENANCE
========================= */

let logs = JSON.parse(localStorage.getItem("logs")) || [];

function saveLogs(){
  localStorage.setItem("logs",JSON.stringify(logs));
}

function addLog(){
  if(!date.value || !task.value) return;
  logs.push({date:date.value,task:task.value});
  saveLogs();
  task.value="";
  renderLogs();
}

function renderLogs(){
  logTable.innerHTML="";

  logs.forEach((log,i)=>{
    logTable.innerHTML+=`
      <tr class="swipe-maint" data-index="${i}">
        <td>${log.date}</td>
        <td>${log.task}</td>
      </tr>`;
  });

  initMaintenanceSwipe();
}

function initMaintenanceSwipe(){
  let startX=0;

  document.querySelectorAll(".swipe-maint").forEach(row=>{
    row.addEventListener("touchstart", e=>{
      startX=e.touches[0].clientX;
    });

    row.addEventListener("touchmove", e=>{
      let diff=e.touches[0].clientX-startX;
      if(diff<0){
        row.style.transform=`translateX(${diff}px)`;
      }
    });

    row.addEventListener("touchend", ()=>{
      let current=parseInt(row.style.transform.replace(/[^0-9\-]/g,""))||0;

      if(current<-60){
        let index=row.dataset.index;
        logs.splice(index,1);
        saveLogs();
        renderLogs();
      }else{
        row.style.transform="translateX(0)";
      }
    });
  });
}

/* =========================
   DISTANCE / RIDE LOG
========================= */

let distanceLogs = JSON.parse(localStorage.getItem("distanceLogs")) || [];

function saveDistance(){
  localStorage.setItem("distanceLogs",JSON.stringify(distanceLogs));
}

function addDistance(){
  if(!distDate.value || !route.value || !distance.value) return;

  distanceLogs.push({
    date:distDate.value,
    route:route.value,
    distance:parseFloat(distance.value)
  });

  saveDistance();
  route.value="";
  distance.value="";
  renderDistance();
}

function renderDistance(){
  distanceTable.innerHTML="";
  let total=0, monthly=0, pb=0;
  const now=new Date();

  distanceLogs.forEach(log=>{
    total+=log.distance;
    if(log.distance>pb) pb=log.distance;

    const d=new Date(log.date);
    if(d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear()){
      monthly+=log.distance;
    }
  });

  distanceLogs.forEach((log,i)=>{
    const isPB = log.distance===pb;

    distanceTable.innerHTML+=`
      <tr class="swipe-distance ${isPB?'pb-highlight':''}" data-index="${i}">
        <td>${log.date}</td>
        <td class="route-cell collapsed">${log.route}</td>
        <td>${log.distance}${isPB?'<span class="pb-badge"> PB</span>':''}</td>
      </tr>`;
  });

  totalKm.innerText=total.toFixed(1);
  monthlyKm.innerText=monthly.toFixed(1)+" km";

  initDistanceSwipe();
  initExpand();
}

function initDistanceSwipe(){
  let startX=0;

  document.querySelectorAll(".swipe-distance").forEach(row=>{
    row.addEventListener("touchstart", e=>{
      startX=e.touches[0].clientX;
    });

    row.addEventListener("touchmove", e=>{
      let diff=e.touches[0].clientX-startX;
      if(diff<0){
        row.style.transform=`translateX(${diff}px)`;
      }
    });

    row.addEventListener("touchend", ()=>{
      let current=parseInt(row.style.transform.replace(/[^0-9\-]/g,""))||0;

      if(current<-60){
        let index=row.dataset.index;
        distanceLogs.splice(index,1);
        saveDistance();
        renderDistance();
      }else{
        row.style.transform="translateX(0)";
      }
    });
  });
}

/* =========================
   ROUTE EXPAND
========================= */

function initExpand(){
  document.querySelectorAll(".route-cell").forEach(cell=>{
    cell.addEventListener("click", ()=>{
      cell.classList.toggle("collapsed");
      cell.classList.toggle("expanded");
    });
  });
}

/* INIT */
renderLogs();
renderDistance();
</script>
</body>
</html>
