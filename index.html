<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BikeCare</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BikeCare">
<meta name="theme-color" content="#0f0f0f">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
  color: #ffffff;
  padding: 20px;
}

h1 {
  text-align: center;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

.tabs {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
  gap: 10px;
}

.tab-btn {
  flex: 1;
  max-width: 180px;
  padding: 10px;
  border-radius: 25px;
  border: 1px solid #333;
  background: #1a1a1a;
  color: #aaa;
  cursor: pointer;
  transition: 0.3s;
}

.tab-btn.active {
  background: #2d6cdf;
  color: #fff;
  box-shadow: 0 0 15px rgba(45,108,223,0.6);
}

.card {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #121212;
  color: white;
}

button.primary {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #2d6cdf;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button.primary:hover {
  transform: scale(1.03);
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 14px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #333;
  text-align: left;
}

th {
  color: #aaa;
  font-weight: 500;
}

.delete-btn {
  background: transparent;
  border: none;
  color: #ff4d4d;
  cursor: pointer;
}

#distanceStats {
  margin-top: 10px;
  font-weight: 500;
  color: #2d6cdf;
}
</style>
</head>
<body>

<h1>🚴 BIKECARE</h1>

<div class="tabs">
  <button class="tab-btn active" id="maintBtn" onclick="showTab('maintenance')">Maintenance</button>
  <button class="tab-btn" id="rideBtn" onclick="showTab('ride')">Ride Log</button>
</div>

<!-- MAINTENANCE -->
<div id="maintenanceTab" class="card">

<input type="date" id="date">
<input type="text" id="task" placeholder="Maintenance task">
<button class="primary" onclick="addLog()">Add Maintenance</button>

<table>
<thead>
<tr>
<th>Date</th>
<th>Task</th>
<th></th>
</tr>
</thead>
<tbody id="logTable"></tbody>
</table>

</div>

<!-- RIDE LOG -->
<div id="rideTab" class="card" style="display:none;">

<input type="date" id="distDate">
<input type="text" id="route" placeholder="Route (HOM - GGC - HOM)">
<input type="number" id="distance" placeholder="Distance (km)">
<input type="text" id="distNotes" placeholder="Notes (optional)">
<button class="primary" onclick="addDistance()">Add Ride</button>

<div id="distanceStats"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Route</th>
<th>KM</th>
<th></th>
</tr>
</thead>
<tbody id="distanceTable"></tbody>
</table>

</div>

<script>

// Auto date
document.getElementById("date").valueAsDate = new Date();
document.getElementById("distDate").valueAsDate = new Date();

// Tab switch
function showTab(tab) {
  document.getElementById("maintenanceTab").style.display = tab === "maintenance" ? "block" : "none";
  document.getElementById("rideTab").style.display = tab === "ride" ? "block" : "none";

  document.getElementById("maintBtn").classList.toggle("active", tab === "maintenance");
  document.getElementById("rideBtn").classList.toggle("active", tab === "ride");
}

// Maintenance
let logs = JSON.parse(localStorage.getItem("logs")) || [];

function saveLogs() {
  localStorage.setItem("logs", JSON.stringify(logs));
}

function addLog() {
  const date = date.value;
  const taskValue = task.value;
  if (!date || !taskValue) return;

  logs.push({ date, task: taskValue });
  saveLogs();
  renderLogs();
  task.value = "";
}

function deleteLog(index) {
  logs.splice(index, 1);
  saveLogs();
  renderLogs();
}

function renderLogs() {
  logTable.innerHTML = "";
  logs.sort((a,b)=> new Date(b.date)-new Date(a.date));
  logs.forEach((log,i)=>{
    logTable.innerHTML += `
      <tr>
        <td>${log.date}</td>
        <td>${log.task}</td>
        <td><button class="delete-btn" onclick="deleteLog(${i})">✕</button></td>
      </tr>`;
  });
}
renderLogs();

// Ride Log
let rides = JSON.parse(localStorage.getItem("distanceLogs")) || [];

function saveRides() {
  localStorage.setItem("distanceLogs", JSON.stringify(rides));
}

function addDistance() {
  const date = distDate.value;
  const routeVal = route.value;
  const km = distance.value;
  if (!date || !routeVal || !km) return;

  rides.push({ date, route: routeVal, distance: parseFloat(km) });
  saveRides();
  renderRides();

  route.value = "";
  distance.value = "";
  distNotes.value = "";
}

function deleteRide(index) {
  rides.splice(index,1);
  saveRides();
  renderRides();
}

function renderRides() {
  distanceTable.innerHTML = "";
  let total = 0;

  rides.sort((a,b)=> new Date(b.date)-new Date(a.date));
  rides.forEach((ride,i)=>{
    total += ride.distance;
    distanceTable.innerHTML += `
      <tr>
        <td>${ride.date}</td>
        <td>${ride.route}</td>
        <td>${ride.distance}</td>
        <td><button class="delete-btn" onclick="deleteRide(${i})">✕</button></td>
      </tr>`;
  });

  distanceStats.innerHTML = "Total Distance: " + total.toFixed(2) + " km";
}
renderRides();

</script>

</body>
</html>
